<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roastmate — Joke Repository</title><link rel="stylesheet" href="style.css?v=3"><style>main{max-width:1000px}.filters{display:flex;gap:12px;margin:28px 0;flex-wrap:wrap}.filters input,.filters select{background:#281c39;color:#fff;border:1px solid #604578;border-radius:8px;padding:14px;font:inherit}.filters input{flex:1;min-width:220px}.joke{background:#2d203e;padding:20px;border-radius:12px;margin:14px 0}.joke h2{color:#ffa078;font-size:15px;margin:0 0 12px}.joke p{font-size:18px;line-height:1.5;margin:0}.joke small{display:block;color:#ac9abf;margin-top:12px}.links{display:flex;gap:20px;margin:18px 0}a{color:#c6f89d}.stats{font-size:15px;color:#b9a9cb;line-height:1.7}#more{background:#baff71;color:#20301d;margin-top:15px}</style></head><body><header><a class="brand" href="./"><span>♜</span> roastmate</a><a href="./" style="margin-left:auto">Back to the board ↗</a></header><main><label>THE ORIGINAL ROAST REPOSITORY</label><h1>Actual jokes.<br><em>Actual references.</em></h1><p class="stats">1,010 complete joke templates. 101 named references. Ten chess situations.<br>No recycled opening-and-ending combinations counted as fresh material.</p><div class="links"><a href="joke-library.json" download>Download the full JSON repository</a></div><div class="filters"><input id="search" placeholder="Search a joke or reference…" aria-label="Search jokes"><select id="category" aria-label="Chess category"><option value="">All move categories</option></select></div><p id="count" class="stats"></p><div id="results"></div><button id="more">Show more jokes</button></main><script type="module">import {bank} from './joke-bank.mjs';const names={edge:'Edge-pawn moves',queen:'Early queen excursions',repeat:'Repeated piece moves',hanging:'Attacked destination',center:'Center control',develop:'Development',capture:'Captures',castle:'Castling',check:'Giving check',normal:'General moves'};const $=s=>document.querySelector(s);let limit=30;for(const [value,name] of Object.entries(names)){const o=document.createElement('option');o.value=value;o.textContent=name;$('#category').append(o)}function render(){const term=$('#search').value.toLowerCase();const category=$('#category').value;const list=bank.filter(x=>(!category||x.category===category)&&(x.reference+' '+x.text).toLowerCase().includes(term));$('#count').textContent=list.length+' jokes match';$('#results').replaceChildren();for(const joke of list.slice(0,limit)){const el=document.createElement('article');el.className='joke';const h=document.createElement('h2');h.textContent=joke.reference+' · '+names[joke.category];const p=document.createElement('p');p.textContent=joke.text;const small=document.createElement('small');small.textContent=joke.id;el.append(h,p,small);$('#results').append(el)}$('#more').hidden=limit>=list.length}$('#search').oninput=$('#category').onchange=()=>{limit=30;render()};$('#more').onclick=()=>{limit+=30;render()};render();</script></body></html>
